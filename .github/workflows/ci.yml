name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # ubuntu-24.04 ships GCC 13 and Clang 18, the compilers the presets name. Clang 18 builds
    # against libc++ 18: libstdc++ hides std::expected from Clang before 19 (ADR-0001).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, clang, release]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libc++-18-dev libc++abi-18-dev
      - name: Configure, build and test (warnings are errors)
        run: cmake --workflow --preset ${{ matrix.preset }}

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # The runner's kernel randomises mmap with 32 bits, which TSan's shadow memory
      # layout can't handle; 28 bits is the long-standing default.
      - if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --workflow --preset ${{ matrix.preset }}

  cuda-compile:
    # No GPU on GitHub's runners: compile the CUDA backend and run the CPU tests only.
    # GPU tests (label "gpu") run locally: ctest --preset cuda.
    runs-on: ubuntu-24.04
    # NVIDIA's registry: the same image as Docker Hub's nvidia/cuda, without Docker Hub's
    # anonymous pull limit (shared runner IPs hit it: PR #15 failed 3 times at the pull).
    container: nvcr.io/nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      # GCC 13 for the C++23 host code; nvcc uses the image's GCC 11 (ADR-0001).
      - name: Install GCC 13, CMake and Ninja
        run: |
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common git python3-pip
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y --no-install-recommends g++-13
          pip3 install cmake==3.31.6 ninja==1.11.1.4
      - uses: actions/checkout@v4
      - run: cmake --preset cuda
      - run: cmake --build --preset cuda
      - run: ctest --preset cuda-cpu

  fuzz:
    # libFuzzer on the SECS-II decoder, HSMS framing and the GEM layer: each replays its checked-in
    # corpus, then gets 60 s of new inputs. Ubuntu's libFuzzer runtime comes with
    # libclang-rt-18-dev; libc++ as in the clang job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libc++-18-dev
          libc++abi-18-dev libclang-rt-18-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --target fuzz-secs-item fuzz-hsms-frames fuzz-gem-messages
      - name: Fuzz for 60 s per target
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          for target in secs_item hsms_frames gem_messages; do
            mkdir -p "$RUNNER_TEMP/corpus-$target"
            "build/fuzz/fuzz/fuzz-${target//_/-}" -max_total_time=60 \
              -artifact_prefix="$RUNNER_TEMP/crashes/$target-" \
              "$RUNNER_TEMP/corpus-$target" "fuzz/corpus/$target"
          done
      # A crash input becomes a regression test: copy it into fuzz/corpus/<target>.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes/

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
